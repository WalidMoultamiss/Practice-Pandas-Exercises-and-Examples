<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <h1>Basketball Team Management</h1>

    <form id="player-form">
        <input type="hidden" id="player-id">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="position" placeholder="Position" required>
        <input type="text" id="statistics" placeholder="Statistics" required>
        <input type="text" id="health" placeholder="Health" required>
        <input type="text" id="injuries" placeholder="Injuries" required>
        <button type="submit">Save Player</button>
    </form>

    <ul id="player-list"></ul>

    <script src="scripts/main.js"></script>
</body>
</html>
